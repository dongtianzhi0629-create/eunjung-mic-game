<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>拯救甜恩静麦克风计划</title>
  <style>
    :root {
      --pink: #ff6ea8;
      --purple: #7c5cff;
      --blue: #46c7ff;
      --yellow: #ffd166;
      --ink: #2d2140;
      --stage: #231833;
      --panel: rgba(255, 255, 255, .88);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at 50% 0%, #5c4ab8 0%, #281947 45%, #120b21 100%);
      touch-action: none;
    }

    .game {
      position: relative;
      width: min(100vw, 520px);
      height: 100dvh;
      min-height: 640px;
      margin: 0 auto;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 16%, rgba(255, 238, 183, .26), transparent 19%),
        radial-gradient(circle at 18% 26%, rgba(255, 96, 66, .22), transparent 18%),
        radial-gradient(circle at 84% 30%, rgba(255, 126, 75, .24), transparent 18%),
        linear-gradient(180deg, #24272a 0%, #302532 28%, #5e2b35 54%, #160d18 100%);
      user-select: none;
    }

    .lights {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .beam {
      position: absolute;
      top: -8%;
      width: 120px;
      height: 66%;
      opacity: .36;
      filter: blur(2px);
      transform-origin: top center;
      background: linear-gradient(180deg, rgba(255, 240, 149, .85), rgba(255, 240, 149, 0));
      clip-path: polygon(46% 0, 58% 0, 100% 100%, 0 100%);
      animation: swingLight 3.4s ease-in-out infinite alternate;
    }
    .beam.one { left: 5%; transform: rotate(-18deg); }
    .beam.two { right: 8%; animation-delay: -.9s; transform: rotate(18deg); background: linear-gradient(180deg, rgba(255, 255, 245, .86), rgba(255, 255, 245, 0)); }
    .beam.three { left: 42%; animation-delay: -1.7s; background: linear-gradient(180deg, rgba(255, 139, 92, .72), rgba(255, 139, 92, 0)); }

    @keyframes swingLight {
      from { transform: rotate(-18deg) translateX(-12px); }
      to { transform: rotate(18deg) translateX(12px); }
    }

    .hud {
      position: absolute;
      z-index: 20;
      top: max(12px, env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
    }

    .pill {
      min-width: 50px;
      padding: 7px 7px;
      border: 1px solid rgba(255, 255, 255, .55);
      border-radius: 999px;
      background: rgba(255, 255, 255, .2);
      color: white;
      font-weight: 800;
      text-shadow: 0 1px 2px rgba(0,0,0,.3);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 22px rgba(0,0,0,.12);
    }

    .pill.right { text-align: right; }

    .level-pill {
      min-width: 78px;
      line-height: 1.08;
      text-align: center;
    }

    .time-pill {
      min-width: 46px;
      padding: 6px 8px;
      font-size: 13px;
      font-weight: 900;
      text-align: center;
      background: rgba(255, 255, 255, .12);
      border-color: rgba(255, 255, 255, .32);
      box-shadow: none;
    }

    .score-pill {
      min-width: 58px;
      text-align: center;
      font-size: 14px;
      font-weight: 1000;
    }

    .lives-pill {
      min-width: 94px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding-left: 7px;
      padding-right: 7px;
    }

    .life-icon {
      width: 15px;
      height: 15px;
      object-fit: contain;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.22));
      transition: opacity .18s ease, transform .18s ease;
    }

    .life-icon.hidden {
      opacity: 0;
      transform: scale(.35);
    }

    .pause-btn {
      display: grid;
      place-items: center;
      width: 34px;
      min-width: 34px;
      height: 34px;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, .55);
      border-radius: 50%;
      background: rgba(255, 255, 255, .2);
      color: white;
      font-size: 16px;
      font-weight: 900;
      line-height: 1;
      text-align: center;
      text-shadow: 0 1px 2px rgba(0,0,0,.3);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 22px rgba(0,0,0,.12);
    }

    .combo-pill {
      min-width: 62px;
      text-align: center;
      transform: scale(.96);
      opacity: .78;
      transition: transform .16s ease, opacity .16s ease, background .16s ease;
    }

    .combo-pill.active {
      opacity: 1;
      transform: scale(1.04);
      background: rgba(255, 209, 102, .32);
    }

    .stage-top {
      position: absolute;
      left: 0;
      right: 0;
      top: 64px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,.92);
      font-weight: 900;
      letter-spacing: .08em;
      text-shadow: 0 2px 8px rgba(0,0,0,.35);
      font-size: 0;
    }

    .stage-top::before,
    .stage-top::after {
      content: "";
      width: 66px;
      height: 3px;
      margin: 0 12px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, #fff, transparent);
      opacity: .75;
    }

    .back-signature {
      position: absolute;
      z-index: 2;
      left: -8%;
      right: -8%;
      top: 58px;
      height: 292px;
      overflow: hidden;
      pointer-events: none;
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 1px, transparent 1px 5px),
        radial-gradient(ellipse at 50% 64%, rgba(255, 221, 156, .22), transparent 42%),
        radial-gradient(ellipse at 22% 74%, rgba(255, 94, 59, .3), transparent 36%),
        radial-gradient(ellipse at 82% 72%, rgba(255, 120, 69, .28), transparent 35%),
        linear-gradient(180deg, rgba(6, 8, 10, .76), rgba(37, 22, 29, .34) 45%, rgba(124, 46, 39, .18));
      opacity: .94;
    }

    .back-signature::before {
      content: "T-ARA FAN-CON IN MALAYSIA 2026";
      position: absolute;
      left: 0;
      right: 0;
      top: 92px;
      text-align: center;
      color: rgba(255,255,255,.72);
      font-size: 8px;
      font-weight: 900;
      letter-spacing: .16em;
      text-shadow: 0 0 8px rgba(255,255,255,.5);
    }

    .back-signature::after {
      content: "Summer\A Again";
      white-space: pre;
      position: absolute;
      left: 0;
      right: 0;
      top: 102px;
      text-align: center;
      color: rgba(255,255,250,.96);
      font-family: "Brush Script MT", "Segoe Script", "Snell Roundhand", Georgia, serif;
      font-size: clamp(48px, 14vw, 84px);
      font-style: italic;
      line-height: .7;
      letter-spacing: -.07em;
      transform: rotate(-2deg);
      text-shadow:
        0 0 5px rgba(255,255,255,.86),
        0 0 18px rgba(255, 201, 129, .72),
        0 0 42px rgba(255, 96, 66, .38);
    }

    .sig {
      position: absolute;
      display: block;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, .38));
      opacity: .76;
    }

    .sig.loop {
      left: 17%;
      top: 116px;
      width: 220px;
      height: 5px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.84), transparent);
      transform: rotate(22deg);
    }

    .sig.slash {
      width: 252px;
      height: 5px;
      left: 52%;
      top: 122px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.86), transparent);
      transform: rotate(-27deg);
    }

    .sig.tail {
      left: 4%;
      right: 4%;
      top: 42px;
      height: 38px;
      border: 0;
      border-radius: 0;
      background:
        radial-gradient(circle at 5% 50%, #fff7d8 0 4px, transparent 6px),
        radial-gradient(circle at 16% 50%, #ff7c5c 0 4px, transparent 6px),
        radial-gradient(circle at 27% 50%, #fff2ba 0 4px, transparent 6px),
        radial-gradient(circle at 38% 50%, #ff7758 0 4px, transparent 6px),
        radial-gradient(circle at 50% 50%, #fff7d8 0 4px, transparent 6px),
        radial-gradient(circle at 62% 50%, #ff7c5c 0 4px, transparent 6px),
        radial-gradient(circle at 73% 50%, #fff2ba 0 4px, transparent 6px),
        radial-gradient(circle at 84% 50%, #ff7758 0 4px, transparent 6px),
        radial-gradient(circle at 95% 50%, #fff7d8 0 4px, transparent 6px);
      box-shadow: 0 0 28px rgba(255, 160, 93, .4);
    }

    .audience-phone {
      position: absolute;
      z-index: 11;
      left: 50%;
      bottom: 78px;
      width: 78px;
      height: 112px;
      border-radius: 14px;
      background: linear-gradient(180deg, #100915, #040307);
      border: 4px solid rgba(255,255,255,.1);
      box-shadow: 0 16px 24px rgba(0,0,0,.32);
      transform: translateX(-54%) rotate(-2deg);
      pointer-events: none;
      opacity: .78;
    }

    .audience-phone::before {
      content: "";
      position: absolute;
      inset: 10px 8px 38px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background:
        radial-gradient(circle at 50% 74%, rgba(255,255,255,.36), transparent 8%),
        linear-gradient(180deg, #261733, #120a1b);
      color: #ffc27a;
      font-size: 13px;
      font-weight: 1000;
      letter-spacing: .06em;
      text-shadow: 0 0 8px rgba(255,194,122,.7);
    }

    .performers {
      position: absolute;
      z-index: 4;
      top: 140px;
      left: clamp(10px, 6vw, 38px);
      right: clamp(10px, 6vw, 38px);
      height: 220px;
      display: grid;
      grid-template-columns: .96fr 1fr 1fr 1.04fr;
      align-items: end;
      gap: 0;
      animation: beatRow .56s ease-in-out infinite alternate;
    }

    @keyframes beatRow {
      from { transform: translateY(0); }
      to { transform: translateY(7px); }
    }

    .person {
      position: relative;
      height: 202px;
      display: grid;
      place-items: end center;
      transform-origin: 50% 100%;
      animation: dance .72s ease-in-out infinite alternate;
      translate: var(--stage-x, 0) var(--stage-y, 0);
      scale: var(--stage-scale, 1);
      z-index: var(--stage-z, 4);
    }
    .person:nth-child(2) { animation-delay: -.12s; }
    .person:nth-child(3) { animation-delay: -.24s; }
    .person:nth-child(4) { animation-delay: -.36s; }

    @keyframes dance {
      from { transform: translateX(-3px) rotate(-2deg); }
      to { transform: translateX(3px) rotate(2deg); }
    }

    .person::after {
      content: "";
      position: absolute;
      z-index: -1;
      left: 50%;
      bottom: 11px;
      width: 62px;
      height: 16px;
      border-radius: 50%;
      background: rgba(0,0,0,.28);
      filter: blur(3px);
      transform: translateX(-50%);
    }

    .character-sprite {
      width: clamp(78px, 18vw, 94px);
      height: clamp(126px, 29vw, 152px);
      object-fit: contain;
      object-position: center bottom;
      user-select: none;
      pointer-events: none;
      filter: drop-shadow(0 8px 8px rgba(0,0,0,.22));
      transform-origin: 50% 92%;
    }

    .person.thrower.is-throwing-now .character-sprite {
      animation: spriteThrow .42s ease-out 1;
    }

    @keyframes spriteThrow {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      34% { transform: rotate(-7deg) translateY(-6px); }
      62% { transform: rotate(3deg) translateY(1px); }
    }

    .hyomin {
      --stage-x: -10px;
      --stage-y: 0;
      --stage-scale: 1;
      --stage-z: 3;
    }

    .qri {
      --stage-x: -4px;
      --stage-y: 0;
      --stage-scale: 1;
      --stage-z: 5;
    }

    .jiyeon {
      --stage-x: 6px;
      --stage-y: 0;
      --stage-scale: 1;
      --stage-z: 4;
    }

    .eunjung {
      --stage-x: 14px;
      --stage-y: 0;
      --stage-scale: 1;
      --stage-z: 6;
    }

    .avatar {
      position: relative;
      width: 86px;
      height: 158px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .head {
      position: relative;
      z-index: 2;
      width: 74px;
      height: 74px;
      border: 3px solid rgba(65, 38, 56, .34);
      border-radius: 50%;
      background:
        radial-gradient(circle at 34% 31%, rgba(255,255,255,.5), transparent 12%),
        linear-gradient(180deg, #ffe3d8, #ffc7b7);
      box-shadow: inset 0 -7px 0 rgba(222, 111, 110, .11), 0 8px 14px rgba(0,0,0,.16);
    }

    .hair {
      position: absolute;
      left: -1px;
      right: -1px;
      top: -9px;
      height: 42px;
      border-radius: 42px 42px 22px 22px;
      background: var(--hair, #3b2b45);
    }

    .hair::before,
    .hair::after {
      content: "";
      position: absolute;
      top: 22px;
      width: 18px;
      height: 46px;
      border-radius: 999px;
      background: var(--hair, #3b2b45);
    }
    .hair::before { left: -5px; transform: rotate(12deg); }
    .hair::after { right: -5px; transform: rotate(-12deg); }

    .face {
      position: absolute;
      inset: 23px 12px 9px;
    }
    .face::before,
    .face::after {
      content: "";
      position: absolute;
      top: 27px;
      width: 10px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 118, 133, .28);
      filter: blur(.2px);
    }
    .face::before { left: 2px; }
    .face::after { right: 2px; }
    .eye {
      position: absolute;
      top: 5px;
      width: 14px;
      height: 18px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 25%, #fff 0 2px, transparent 3px),
        radial-gradient(circle at 63% 65%, rgba(255,255,255,.75) 0 1px, transparent 2px),
        linear-gradient(180deg, #553044, #170f1f 78%);
      box-shadow: 0 1px 0 rgba(255,255,255,.45);
    }
    .eye.left { left: 8px; transform: rotate(-4deg); }
    .eye.right { right: 8px; transform: rotate(4deg); }
    .mouth {
      position: absolute;
      left: 50%;
      bottom: 7px;
      width: 16px;
      height: 9px;
      border-bottom: 3px solid #c95d69;
      border-radius: 0 0 12px 12px;
      transform: translateX(-50%);
    }

    .body {
      position: relative;
      width: 58px;
      height: 58px;
      margin-top: -5px;
      border-radius: 24px 24px 16px 16px;
      background: linear-gradient(160deg, var(--dress), color-mix(in srgb, var(--dress) 72%, #111 28%));
      box-shadow: 0 8px 12px rgba(0,0,0,.16);
    }

    .body::before {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      top: 12px;
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.44);
      opacity: .9;
    }

    .body::after {
      content: "";
      position: absolute;
      left: 7px;
      right: 7px;
      bottom: 11px;
      height: 6px;
      border-radius: 999px;
      background: rgba(255,255,255,.64);
      box-shadow: 0 10px 0 rgba(255,255,255,.22);
    }

    .hyomin .hair {
      background: linear-gradient(90deg, #2a2232 0 56%, #7b2038 57% 100%);
    }
    .hyomin .hair::after {
      width: 22px;
      height: 58px;
      right: -11px;
      top: 20px;
      background: linear-gradient(180deg, #8f253e, #3a2638);
      transform: rotate(-16deg);
    }
    .hyomin .body {
      background:
        linear-gradient(90deg, #c8203f 0 34%, #f2e6dc 35% 78%, #c8203f 79% 100%);
    }
    .hyomin .arm.left::after {
      content: "";
      position: absolute;
      left: 1px;
      bottom: 2px;
      width: 14px;
      height: 17px;
      border-radius: 999px;
      background: #b01835;
    }

    .qri .hair {
      background: linear-gradient(180deg, #a5333c, #6d2632);
    }
    .qri .hair::before,
    .qri .hair::after {
      background: linear-gradient(180deg, #b9434a, #6d2632);
      height: 62px;
    }
    .qri .body {
      background: linear-gradient(160deg, #d21f43, #891c31);
      border-radius: 28px 28px 12px 12px;
    }
    .qri .body::before {
      left: 19px;
      right: 19px;
      top: -4px;
      height: 32px;
      background: transparent;
      border-left: 4px solid rgba(255,255,255,.72);
      border-right: 4px solid rgba(255,255,255,.72);
      transform: rotate(32deg);
    }

    .jiyeon .hair {
      background: #2a2130;
    }
    .jiyeon .hair::before,
    .jiyeon .hair::after {
      top: 25px;
      height: 38px;
      width: 22px;
      background: #2a2130;
    }
    .jiyeon .body {
      height: 50px;
      margin-top: 3px;
      background:
        linear-gradient(135deg, #f4eee5 0 33%, #c81937 34% 64%, #2c2436 65% 100%);
      border-radius: 18px;
    }
    .jiyeon .leg {
      width: 16px;
      height: 42px;
      background: #e8dfd2;
      border-radius: 8px 8px 999px 999px;
      box-shadow: inset 0 -8px 0 rgba(70, 50, 62, .18);
    }

    .eunjung .hair {
      background: linear-gradient(180deg, #25212d, #15111b);
    }
    .eunjung .hair::before,
    .eunjung .hair::after {
      height: 66px;
      top: 17px;
      background: linear-gradient(180deg, #25212d, #15111b);
    }
    .eunjung .body {
      background: linear-gradient(160deg, #e62c45, #a0152b);
      border-radius: 24px 24px 12px 12px;
    }
    .eunjung .body::before {
      left: -1px;
      right: -1px;
      top: 3px;
      height: 12px;
      background: #ffd8c8;
      border-radius: 999px;
    }
    .eunjung .leg {
      height: 32px;
      background: #eee4d9;
    }

    .waist-wrap {
      position: absolute;
      left: -9px;
      right: -9px;
      bottom: -12px;
      height: 25px;
      border-radius: 14px 14px 20px 20px;
      background: linear-gradient(135deg, #eee5d8, #cfc5b7);
      box-shadow: inset 0 -6px 0 rgba(73, 57, 76, .12);
    }

    .held-mic {
      position: absolute;
      z-index: 4;
      right: -14px;
      top: 13px;
      width: 9px;
      height: 38px;
      border-radius: 999px;
      background: linear-gradient(90deg, #171520, #777987, #171520);
      transform: rotate(-18deg);
      box-shadow: 0 -9px 0 4px #343544;
    }

    .arm {
      position: absolute;
      top: 10px;
      width: 14px;
      height: 42px;
      border-radius: 999px;
      background: #ffd8c8;
      transform-origin: top center;
    }
    .arm.left { left: -7px; transform: rotate(24deg); }
    .arm.right { right: -7px; transform: rotate(-24deg); }
    .person.thrower .arm.right { animation: throwArm 2.2s ease-in-out infinite; }

    @keyframes throwArm {
      0%, 78%, 100% { transform: rotate(-24deg); }
      84% { transform: rotate(-105deg); }
      90% { transform: rotate(-35deg); }
    }

    .legs {
      display: flex;
      gap: 10px;
      margin-top: -1px;
    }
    .leg {
      width: 12px;
      height: 27px;
      border-radius: 0 0 999px 999px;
      background: #2f2545;
    }

    .name-tag {
      position: absolute;
      bottom: -8px;
      min-width: 58px;
      padding: 4px 7px 5px;
      border-radius: 14px;
      background: rgba(255,255,255,.84);
      font-size: 11px;
      line-height: 1.05;
      text-align: center;
      font-weight: 900;
      box-shadow: 0 4px 10px rgba(0,0,0,.14);
    }
    .name-tag small {
      display: block;
      margin-top: 2px;
      color: #695d78;
      font-size: 9px;
      letter-spacing: .02em;
    }

    .stage {
      position: absolute;
      z-index: 3;
      left: -10%;
      right: -10%;
      top: 344px;
      height: 92px;
      border-radius: 50% 50% 18px 18px / 50% 50% 16px 16px;
      background:
        radial-gradient(ellipse at 50% 12%, rgba(255, 232, 174, .27), transparent 46%),
        linear-gradient(180deg, #6b3737, #2d1b25 62%, #130b16);
      border-top: 5px solid rgba(255, 236, 194, .78);
      box-shadow: 0 22px 40px rgba(0,0,0,.35);
    }

    .stage::after {
      content: "";
      position: absolute;
      left: 20%;
      right: 20%;
      top: 22px;
      height: 7px;
      border-radius: 999px;
      background: repeating-linear-gradient(90deg, #fff1bc 0 18px, #ff795d 18px 36px, #ffd166 36px 54px);
      opacity: .82;
      filter: blur(.2px);
    }

    .arena {
      position: absolute;
      z-index: 8;
      left: 0;
      right: 0;
      top: 130px;
      bottom: 84px;
      pointer-events: none;
    }

    .mic {
      position: absolute;
      width: 52px;
      height: 52px;
      transform: translate(-50%, -50%);
      will-change: transform;
      filter: drop-shadow(0 8px 9px rgba(0,0,0,.25));
    }

    .mic .cap {
      position: absolute;
      left: 6px;
      top: 2px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: radial-gradient(circle at 34% 30%, #fff, #d7d9e8 22%, #5d6070 72%);
      border: 2px solid rgba(0,0,0,.24);
    }
    .mic .handle {
      position: absolute;
      left: 27px;
      top: 21px;
      width: 12px;
      height: 33px;
      border-radius: 999px;
      background: linear-gradient(90deg, #242637, #777b92, #242637);
      transform: rotate(-34deg);
      transform-origin: top center;
    }

    .hands {
      position: absolute;
      z-index: 12;
      left: 50%;
      bottom: 54px;
      width: 79px;
      height: 105px;
      transform: translateX(-50%);
      will-change: left, transform;
      filter: drop-shadow(0 9px 14px rgba(0,0,0,.3));
    }

    .hands-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center bottom;
      pointer-events: none;
      user-select: none;
    }
    .hands.catch {
      animation: catchPop .18s ease-out;
    }
    @keyframes catchPop {
      0% { transform: translateX(-50%) scale(1); }
      60% { transform: translateX(-50%) scale(1.14); }
      100% { transform: translateX(-50%) scale(1); }
    }

    .game.miss-shake {
      animation: missShake .18s ease-out;
    }

    @keyframes missShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .ground {
      position: absolute;
      z-index: 1;
      left: 0;
      right: 0;
      bottom: 0;
      height: 42%;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.12), transparent 44%),
        linear-gradient(180deg, #1c132b, #07040d);
    }

    .ground::before {
      content: "";
      position: absolute;
      left: -8%;
      right: -8%;
      bottom: -18px;
      height: 126px;
      background:
        radial-gradient(ellipse at 8% 78%, #050307 0 34px, transparent 35px),
        radial-gradient(ellipse at 19% 72%, #08050b 0 43px, transparent 44px),
        radial-gradient(ellipse at 33% 80%, #050307 0 38px, transparent 39px),
        radial-gradient(ellipse at 49% 73%, #08050b 0 46px, transparent 47px),
        radial-gradient(ellipse at 64% 80%, #050307 0 38px, transparent 39px),
        radial-gradient(ellipse at 79% 74%, #08050b 0 44px, transparent 45px),
        radial-gradient(ellipse at 93% 79%, #050307 0 38px, transparent 39px);
      opacity: .86;
    }

    .hint {
      display: none;
    }

    .overlay {
      position: absolute;
      z-index: 40;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(13, 7, 24, .62);
      backdrop-filter: blur(10px);
    }
    .overlay.hidden {
      display: none !important;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .pause-overlay {
      position: absolute;
      z-index: 34;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(13, 7, 24, .58);
      backdrop-filter: blur(6px);
      pointer-events: auto;
    }

    .pause-overlay.hidden { display: none; }

    .pause-card {
      width: min(82vw, 320px);
      padding: 22px;
      border-radius: 24px;
      background: rgba(255, 255, 255, .92);
      color: var(--ink);
      text-align: center;
      box-shadow: 0 24px 64px rgba(0,0,0,.32);
    }

    .pause-card h2 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    .pause-card p {
      margin: 0 0 16px;
      color: #685d77;
      font-size: 14px;
      line-height: 1.5;
    }

    .pause-actions {
      display: grid;
      gap: 10px;
    }

    .card {
      width: min(100%, 390px);
      max-height: 88dvh;
      overflow: auto;
      padding: 22px;
      border-radius: 28px;
      background: var(--panel);
      box-shadow: 0 28px 80px rgba(0,0,0,.32);
      text-align: center;
      position: relative;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      line-height: 1.12;
    }

    .subtitle {
      margin: 0 auto 18px;
      color: #685d77;
      line-height: 1.55;
      font-size: 14px;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    button, input {
      width: 100%;
      border: 0;
      border-radius: 16px;
      font: inherit;
    }

    input {
      margin: 12px 0 4px;
      padding: 13px 14px;
      background: #fff;
      color: var(--ink);
      border: 2px solid #eee3ff;
      outline: none;
      font-weight: 700;
    }

    button {
      padding: 13px 14px;
      cursor: pointer;
      color: white;
      font-weight: 900;
      background: linear-gradient(135deg, var(--pink), var(--purple));

    }

    button.secondary {
      color: var(--ink);
      background: #fff;
      border: 2px solid #eadfff;
      box-shadow: none;
    }

    button:disabled {
      cursor: wait;
      opacity: .68;
      filter: grayscale(.18);
    }

    .loading-note {
      min-height: 18px;
      margin: 8px 0 0;
      color: #7a7088;
      font-size: 12px;
      font-weight: 800;
    }

    .credit-watermark {
      margin: 12px 0 2px;
      color: rgba(81, 64, 100, .62);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .lang-toggle {
      position: absolute;
      top: 14px;
      right: 14px;
      width: auto;
      min-width: 44px;
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .72);
      color: #6f5d86;
      font-size: 12px;
      font-weight: 1000;
      box-shadow: none;
      border: 1px solid rgba(124, 92, 255, .18);
    }

    .tuning {
      margin-top: 14px;
      padding: 12px;
      border-radius: 18px;
      background: rgba(124, 92, 255, .08);
      text-align: left;
    }

    .tuning summary {
      cursor: pointer;
      font-weight: 900;
      color: #514064;
    }

    .tuning label {
      display: grid;
      grid-template-columns: 78px 1fr 44px;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      color: #685d77;
      font-size: 13px;
      font-weight: 800;
    }

    .tuning input[type="range"] {
      margin: 0;
      padding: 0;
      border: 0;
      accent-color: var(--purple);
    }

    .leaderboard {
      margin: 16px 0 0;
      padding: 0;
      list-style: none;
      text-align: left;
    }
    .leaderboard li {
      display: grid;
      grid-template-columns: 38px 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(45, 33, 64, .1);
      font-weight: 800;
    }
    .leaderboard small {
      display: block;
      margin-top: 2px;
      color: #7a7088;
      font-size: 11px;
      font-weight: 600;
    }

    .toast {
      position: absolute;
      z-index: 30;
      left: 50%;
      top: 46%;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,.9);
      color: var(--ink);
      font-weight: 900;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, 10px) scale(.96);
    }
    .toast.show {
      animation: toast var(--toast-duration, .62s) ease-out;
    }
    .toast.combo-toast {
      top: 22%;
      padding: 8px 18px;
      border-radius: 18px;
      background: rgba(14, 10, 24, .38);
      color: white;
      text-align: center;
      letter-spacing: .08em;
      box-shadow: 0 0 24px rgba(255, 213, 96, .28);
    }
    .combo-count {
      display: inline-block;
      color: #ffe36f;
      font-size: 30px;
      line-height: .9;
      font-weight: 1000;
      text-shadow: 0 0 10px rgba(255, 225, 95, .72), 0 2px 0 rgba(102, 62, 0, .5);
    }
    .combo-word {
      display: block;
      margin-top: 2px;
      color: #ffffff;
      font-size: 10px;
      line-height: 1;
      font-weight: 1000;
      text-shadow: 0 0 8px rgba(255, 255, 255, .62);
    }
    @keyframes toast {
      0% { opacity: 0; transform: translate(-50%, 10px) scale(.96); }
      25% { opacity: 1; transform: translate(-50%, -2px) scale(1.05); }
      100% { opacity: 0; transform: translate(-50%, -28px) scale(1); }
    }

    .floating-score {
      position: absolute;
      z-index: 31;
      left: 0;
      top: 0;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .92);
      color: var(--ink);
      font-weight: 1000;
      pointer-events: none;
      transform: translate(-50%, -50%);
      animation: floatScore .72s ease-out forwards;
      box-shadow: 0 8px 18px rgba(0,0,0,.14);
    }

    @keyframes floatScore {
      0% { opacity: 0; transform: translate(-50%, -25%) scale(.86); }
      18% { opacity: 1; transform: translate(-50%, -65%) scale(1.12); }
      100% { opacity: 0; transform: translate(-50%, -155%) scale(1); }
    }

    .confetti {
      position: absolute;
      z-index: 29;
      width: 8px;
      height: 14px;
      border-radius: 3px;
      pointer-events: none;
      animation: fall .8s ease-out forwards;
    }
    @keyframes fall {
      to { opacity: 0; transform: translate(var(--dx), 70px) rotate(240deg); }
    }

    @media (max-height: 700px) {
      .game { min-height: 560px; }
      .performers { top: 126px; left: clamp(8px, 5vw, 30px); right: clamp(8px, 5vw, 30px); }
      .stage { top: 314px; }
      .hint { bottom: 92px; }
    }

    @media (max-width: 480px) {
      .hud {
        left: 6px;
        right: 6px;
        top: max(8px, env(safe-area-inset-top));
        gap: 3px;
      }
      .pill {
        min-width: 0;
        padding: 6px 6px;
        font-size: 12px;
      }
      .score-pill {
        min-width: 54px;
        font-size: 12px;
      }
      .lives-pill {
        min-width: 82px;
        gap: 1px;
        padding-left: 5px;
        padding-right: 5px;
      }
      .life-icon {
        width: 13px;
        height: 13px;
      }
      .level-pill {
        min-width: 64px;
        font-size: 12px;
      }
      .time-pill {
        min-width: 38px;
        padding-left: 5px;
        padding-right: 5px;
      }
      .pause-btn {
        width: 32px;
        min-width: 32px;
        height: 32px;
        font-size: 14px;
      }
      .back-signature::after {
        font-size: clamp(44px, 13vw, 64px);
      }
      .performers {
        left: 8px;
        right: 8px;
        top: 136px;
        height: 190px;
      }
      .person {
        height: 176px;
      }
      .hyomin,
      .qri,
      .jiyeon,
      .eunjung {
        --stage-x: 0;
      }
      .character-sprite {
        width: clamp(70px, 18vw, 84px);
        height: clamp(116px, 30vw, 136px);
      }
      .person::after {
        width: 48px;
      }
      .name-tag {
        bottom: -5px;
        min-width: 48px;
        padding: 3px 6px 4px;
        font-size: 10px;
      }
      .name-tag small {
        font-size: 8px;
      }
      .lang-toggle {
        top: 12px;
        right: 12px;
        min-width: 38px;
        padding: 4px 8px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <main class="game" id="game">
    <div class="lights">
      <div class="beam one"></div>
      <div class="beam two"></div>
      <div class="beam three"></div>
    </div>
    <div class="ground"></div>

    <section class="hud">
      <div class="pill score-pill">分数 <span id="score">0</span></div>
      <div class="pill lives-pill" id="lives" aria-label="生命值">
        <img class="life-icon" src="assets/ui/life.png" alt="" />
        <img class="life-icon" src="assets/ui/life.png" alt="" />
        <img class="life-icon" src="assets/ui/life.png" alt="" />
        <img class="life-icon" src="assets/ui/life.png" alt="" />
        <img class="life-icon" src="assets/ui/life.png" alt="" />
      </div>
      <div class="pill level-pill">难度 Level <span id="level">1</span></div>
      <button class="pause-btn" id="pauseBtn" type="button" aria-label="暂停">⏸</button>
      <div class="pill time-pill" id="time">00:30</div>
    </section>

    <div class="stage-top">T-ARA LIVE</div>
    <div class="back-signature" aria-hidden="true">
      <span class="sig loop"></span>
      <span class="sig slash"></span>
      <span class="sig tail"></span>
    </div>

    <section class="performers" aria-label="舞台上的四位 Q 版人物">
      <div class="person hyomin" data-character="hyomin" style="--dress:#c8203f; --hair:#4b2d44">
        <img class="character-sprite" src="assets/characters/states/normal/hyomin.png" alt="孝敏 Q 版角色" />
        <div class="name-tag">孝敏<small>Hyomin</small></div>
      </div>
      <div class="person qri" data-character="qri" style="--dress:#d21f43; --hair:#a5333c">
        <img class="character-sprite" src="assets/characters/states/normal/qri.png" alt="居立 Q 版角色" />
        <div class="name-tag">居丽<small>Qri</small></div>
      </div>
      <div class="person jiyeon" data-character="jiyeon" style="--dress:#c81937; --hair:#2a2130">
        <img class="character-sprite" src="assets/characters/states/normal/jiyeon.png" alt="智妍 Q 版角色" />
        <div class="name-tag">智妍<small>Jiyeon</small></div>
      </div>
      <div class="person thrower eunjung" data-character="eunjung" style="--dress:#e62c45; --hair:#2a2136">
        <img class="character-sprite" src="assets/characters/states/normal/eunjung.png" alt="恩静 Q 版角色" />
        <div class="name-tag">恩静<small>Eunjung</small></div>
      </div>

    <div class="stage"></div>
    <div class="audience-phone" aria-hidden="true"></div>
    <div class="arena" id="arena"></div>
    <div class="hands" id="hands" aria-label="玩家控制的双手">
      <img class="hands-img" src="assets/hands/catch-hands.png" alt="接麦克风的双手" />
    </div>
    <div class="hint" id="hint">按住屏幕左右拖动双手，接住恩静甩出来的麦克风</div>
    <div class="toast" id="toast">+1 接住了！</div>
    <section class="pause-overlay hidden" id="pauseOverlay" aria-hidden="true">
      <div class="pause-card">
        <h2>已暂停</h2>
        <p>麦克风、倒计时和连击都已停住。继续后会从当前状态接着玩。</p>
        <div class="pause-actions">
          <button id="resumeBtn" type="button">继续游戏</button>
        </div>
      </div>
    </section>

    <section class="overlay" id="startOverlay">
      <div class="card">
        <button class="lang-toggle" id="langToggle" type="button">EN</button>
        <h1 id="startTitle">拯救甜恩静麦克风计划</h1>
        <p class="subtitle" id="startDesc">恩静的麦克风在演唱会时不小心滑落了！<br /><br />作为 Queens 的一员，接住掉落的麦克风，帮她完成舞台。</p>
        <input id="nickname" maxlength="12" placeholder="输入你的昵称" autocomplete="nickname" />
        <button id="startBtn" disabled>素材加载中…</button>
        <div class="loading-note" id="loadingNote">正在预加载表情素材，第一次玩会更顺滑</div>
        <div class="credit-watermark">developed by @宫野志保</div>
        <div class="button-row">
          <button class="secondary" id="rankBtn">排行榜</button>
          <button class="secondary" id="resetBtn">清空本地榜</button>
        </div>
      </div>

    <section class="overlay hidden" id="endOverlay">
      <div class="card">

        <button id="againBtn">再玩一次</button>
        <ul class="leaderboard" id="leaderboard"></ul>
      </div>

    <audio id="bgm" src="assets/audio/roly-poly.mp3" preload="auto"></audio>
  </main>

  <script>
    const game = document.getElementById("game");
    const arena = document.getElementById("arena");
    const hands = document.getElementById("hands");
    const scoreEl = document.getElementById("score");
    const timeEl = document.getElementById("time");
    const livesEl = document.getElementById("lives");
    const comboEl = document.getElementById("combo");
    const comboPill = document.getElementById("comboPill");
    const levelEl = document.getElementById("level");
    const pauseBtn = document.getElementById("pauseBtn");
    const pauseOverlay = document.getElementById("pauseOverlay");
    const resumeBtn = document.getElementById("resumeBtn");
    const hint = document.getElementById("hint");
    const toast = document.getElementById("toast");
    const startOverlay = document.getElementById("startOverlay");
    const endOverlay = document.getElementById("endOverlay");
    const endTitle = document.getElementById("endTitle");
    const endText = document.getElementById("endText");
    const leaderboardEl = document.getElementById("leaderboard");
    const nicknameInput = document.getElementById("nickname");
    const gameMusic = document.getElementById("bgm");
    const startBtn = document.getElementById("startBtn");
    const loadingNote = document.getElementById("loadingNote");
    const langToggle = document.getElementById("langToggle");
    const startTitle = document.getElementById("startTitle");
    const startDesc = document.getElementById("startDesc");
    const rankBtn = document.getElementById("rankBtn");
    const resetBtn = document.getElementById("resetBtn");

    const STORAGE_NAME = "eunjung_mic_catch_name";
    const STORAGE_RANK = "eunjung_mic_catch_rank";
    const STORAGE_LANG = "eunjung_mic_catch_lang";
    const FALLBACK_GAME_SECONDS = 210;
    const BGM_VOLUME = 0.25;
    const SFX_VOLUME = 0.5;
    const REACTION_HOLD_MS = 1900;
    const INITIAL_LIVES = 3;
    const MAX_LIVES = 5;
    const LIFE_REWARD_COMBO = 30;
    const MIN_GROUP_GAP_SECONDS = 2;
    const tune = {
      speed: 1,
      frequency: 1,
      catchRange: 1.15,
      bpm: 130
    };
    const characterNames = ["hyomin", "qri", "jiyeon", "eunjung"];
    const characterStates = ["normal", "scared", "throwing", "happy", "miss"];
    const preloadImages = [
      ...characterStates.flatMap(state => characterNames.map(character => `assets/characters/states/${state}/${character}.png`)),
      "assets/hands/catch-hands.png",
      "assets/ui/life.png"
    ];
    const copy = {
      zh: {
        title: "拯救甜恩静麦克风计划",
        desc: "恩静的麦克风在演唱会时不小心滑落了！<br /><br />作为 Queens 的一员，接住掉落的麦克风，帮她完成舞台。",
        nickname: "输入你的昵称",
        loadingButton: "素材加载中…",
        start: "开始接麦",
        loadingInitial: "正在预加载表情素材，第一次玩会更顺滑",
        loadingProgress: "正在预加载表情素材",
        loadingReady: "素材加载完成，可以开始啦",
        loadingFallback: "素材还在后台加载，可先开始试玩",
        loadingMostlyReady: "素材基本加载完成，可开始试玩",
        leaderboard: "排行榜",
        clear: "清空本地榜",
        toggle: "EN"
      },
      en: {
        title: "Mission: Save Eunjung's Mic",
        desc: "Eunjung's microphone slipped during the concert!<br /><br />As a Queen, catch the falling mics and help her finish the stage.",
        nickname: "Enter your nickname",
        loadingButton: "Loading assets…",
        start: "Start the Mission",
        loadingInitial: "Loading character expressions for a smoother first play.",
        loadingProgress: "Loading character expressions",
        loadingReady: "Assets loaded. Ready to play!",
        loadingFallback: "Assets are still loading in the background. You can start now.",
        loadingMostlyReady: "Assets are mostly ready.",
        leaderboard: "Leaderboard",
        clear: "Clear Local Records",
        toggle: "中文"
      }
    };

    let score = 0;
    let combo = 0;
    let bestCombo = 0;
    let misses = 0;
    let lives = INITIAL_LIVES;
    let currentLevel = 1;
    let timeLeft = FALLBACK_GAME_SECONDS;
    let totalGameSeconds = FALLBACK_GAME_SECONDS;
    let running = false;
    let paused = false;
    let pauseStartedAt = 0;
    let lastFrame = 0;
    let lastThrow = 0;
    let nextThrowDelay = 900;
    let nextThrowMusicTime = 0;
    let mics = [];
    let currentThrowGroup = null;
    let rafId = 0;
    let timerId = 0;
    let reactionTimerId = 0;
    let handX = 0.5;
    let beatPhase = 0;
    let gameStartTime = 0;
    let audioCtx = null;
    let uiLang = localStorage.getItem(STORAGE_LANG) === "en" ? "en" : "zh";
    let preloadStatus = "initial";
    let preloadSettled = 0;
    let preloadTotal = preloadImages.length;

    const savedName = localStorage.getItem(STORAGE_NAME);
    if (savedName) nicknameInput.value = savedName;

    function t(key) {
      return copy[uiLang][key];
    }

    function updateLoadingNote() {
      if (!loadingNote) return;
      if (preloadStatus === "progress") {
        loadingNote.textContent = `${t("loadingProgress")} ${preloadSettled}/${preloadTotal}`;
        return;
      }
      loadingNote.textContent = t(preloadStatus === "ready" ? "loadingReady" : preloadStatus === "fallback" ? "loadingFallback" : preloadStatus === "mostlyReady" ? "loadingMostlyReady" : "loadingInitial");
    }

    function applyLanguage() {
      document.documentElement.lang = uiLang === "en" ? "en" : "zh-CN";
      startTitle.textContent = t("title");
      startDesc.innerHTML = t("desc");
      nicknameInput.placeholder = t("nickname");
      rankBtn.textContent = t("leaderboard");
      resetBtn.textContent = t("clear");
      langToggle.textContent = t("toggle");
      startBtn.textContent = startBtn.disabled ? t("loadingButton") : t("start");
      updateLoadingNote();
    }

    function unlockStartButton(status = "ready") {
      preloadStatus = status;
      startBtn.disabled = false;
      startBtn.textContent = t("start");
      updateLoadingNote();
    }

    function preloadImage(src) {
      return new Promise(resolve => {
        const img = new Image();
        img.onload = () => resolve({ src, ok: true });
        img.onerror = () => resolve({ src, ok: false });
        img.src = src;
      });
    }

    function preloadGameAssets() {
      let settled = 0;
      const total = preloadImages.length;
      const timeoutId = setTimeout(() => {
        unlockStartButton("fallback");
      }, 12000);

      Promise.all(preloadImages.map(src => preloadImage(src).then(result => {
        settled += 1;
        preloadSettled = settled;
        preloadStatus = "progress";
        if (startBtn.disabled) updateLoadingNote();
        return result;
      }))).then(results => {
        clearTimeout(timeoutId);
        const failed = results.filter(item => !item.ok).length;
        unlockStartButton(failed ? "mostlyReady" : "ready");
      });
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function setHandsByClientX(clientX) {
      const rect = game.getBoundingClientRect();
      handX = clamp((clientX - rect.left) / rect.width, 0.1, 0.9);
      hands.style.left = `${handX * 100}%`;
    }

    function readRanks() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_RANK)) || [];
      } catch {
        return [];
      }
    }

    function saveRank(name, value) {
      const ranks = readRanks();
      const old = ranks.find(item => item.name === name);
      if (old) {
        old.score = Math.max(old.score, value);
        old.time = Date.now();
      } else {
        ranks.push({ name, score: value, time: Date.now() });
      }
      ranks.sort((a, b) => b.score - a.score || a.time - b.time);
      localStorage.setItem(STORAGE_RANK, JSON.stringify(ranks.slice(0, 20)));
    }

    function renderRanks() {
      const ranks = readRanks();
      leaderboardEl.innerHTML = "";
      if (!ranks.length) {
        leaderboardEl.innerHTML = "<li><span>--</span><span>还没有成绩<small>先来玩第一局吧</small></span><strong>0</strong></li>";
        return;
      }
      ranks.slice(0, 10).forEach((item, index) => {
        const li = document.createElement("li");
        const date = new Date(item.time).toLocaleString("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
        li.innerHTML = `<span>#${index + 1}</span><span>${escapeHtml(item.name)}<small>${date}</small></span><strong>${item.score}</strong>`;
        leaderboardEl.appendChild(li);
      });
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[ch]));
    }

    function formatTime(seconds) {
      const safeSeconds = Math.max(0, Math.ceil(seconds));
      if (safeSeconds < 60) return `${safeSeconds}s`;
      const minutes = Math.floor(safeSeconds / 60);
      const rest = String(safeSeconds % 60).padStart(2, "0");
      return `${String(minutes).padStart(2, "0")}:${rest}`;
    }

    function updateHud() {
      scoreEl.textContent = score;
      timeEl.textContent = formatTime(timeLeft);
      [...livesEl.querySelectorAll(".life-icon")].forEach((icon, index) => {
        icon.classList.toggle("hidden", index >= lives);
      });
      if (comboEl) comboEl.textContent = combo;
      levelEl.textContent = currentLevel;
      if (comboPill) comboPill.classList.toggle("active", combo >= 2);
    }

    function getBeatClock() {
      return gameMusic.paused ? (performance.now() - gameStartTime) / 1000 : gameMusic.currentTime;
    }

    function hideOverlay(el) {
      el.classList.add("hidden");
      el.setAttribute("aria-hidden", "true");
    }

    function showOverlay(el) {
      el.classList.remove("hidden");
      el.removeAttribute("aria-hidden");
    }

    function updatePauseUi() {
      pauseBtn.textContent = paused ? "▶" : "⏸";
      pauseBtn.setAttribute("aria-label", paused ? "继续" : "暂停");
      pauseBtn.title = paused ? "继续" : "暂停";
      pauseOverlay.classList.toggle("hidden", !paused);
      pauseOverlay.setAttribute("aria-hidden", String(!paused));
    }

    function getSongDurationSeconds() {
      if (Number.isFinite(gameMusic.duration) && gameMusic.duration > 0) {
        return Math.ceil(gameMusic.duration);
      }
      return FALLBACK_GAME_SECONDS;
    }

    function setCharacterState(character, state) {
      const img = document.querySelector(`.person[data-character="${character}"] .character-sprite`);
      if (!img) return;
      img.src = `assets/characters/states/${state}/${character}.png`;
    }

    function setAllCharactersState(state) {
      characterNames.forEach(character => setCharacterState(character, state));
    }

    function showThrowReaction() {
      clearTimeout(reactionTimerId);
      setCharacterState("eunjung", "throwing");
      ["hyomin", "qri", "jiyeon"].forEach(character => setCharacterState(character, "scared"));
      const eunjung = document.querySelector('.person[data-character="eunjung"]');
      if (eunjung) {
        eunjung.classList.remove("is-throwing-now");
        void eunjung.offsetWidth;
        eunjung.classList.add("is-throwing-now");
        setTimeout(() => eunjung.classList.remove("is-throwing-now"), 460);
      }
    }

    function showResultReaction(state, duration = 900) {
      clearTimeout(reactionTimerId);
      setAllCharactersState(state);
      reactionTimerId = setTimeout(() => {
        if (running && !paused) setAllCharactersState("normal");
      }, duration);
    }

    function randomThrowDelay() {
      const beatMs = 60000 / tune.bpm;
      const progress = getProgress();
      const beatCount = progress < .35 ? 8 + Math.floor(Math.random() * 3) : 6 + Math.floor(Math.random() * 3);
      const baseDelay = beatMs * beatCount + Math.random() * 180;
      return baseDelay / (tune.frequency * (1 + progress * .28));
    }

    function scheduleNextThrowByBeat() {
      const beatSec = 60 / tune.bpm;
      const progress = getProgress();
      const beatChoices = progress < .35 ? [10, 8, 8, 6] : [8, 8, 6, 6];
      const beats = beatChoices[Math.floor(Math.random() * beatChoices.length)];
      nextThrowMusicTime += (beats * beatSec) / tune.frequency;
    }

    function ensureAudioContext() {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      if (!audioCtx) audioCtx = new Ctx();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }

    function playTone(type) {
      const ctx = ensureAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;
      const gain = ctx.createGain();
      gain.connect(ctx.destination);

      if (type === "throw") {
        const osc = ctx.createOscillator();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(720, now);
        osc.frequency.exponentialRampToValueAtTime(180, now + .16);
        gain.gain.setValueAtTime(.0001, now);
        gain.gain.exponentialRampToValueAtTime(.22 * SFX_VOLUME, now + .018);
        gain.gain.exponentialRampToValueAtTime(.0001, now + .18);
        osc.connect(gain);
        osc.start(now);
        osc.stop(now + .2);
        return;
      }

      if (type === "catch") {
        [660, 990].forEach((freq, index) => {
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, now + index * .055);
          g.gain.setValueAtTime(.0001, now + index * .055);
          g.gain.exponentialRampToValueAtTime(.26 * SFX_VOLUME, now + index * .055 + .015);
          g.gain.exponentialRampToValueAtTime(.0001, now + index * .055 + .18);
          osc.connect(g);
          g.connect(ctx.destination);
          osc.start(now + index * .055);
          osc.stop(now + index * .055 + .2);
        });
        return;
      }

      if (type === "miss") {
        const osc = ctx.createOscillator();
        osc.type = "square";
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(82, now + .22);
        gain.gain.setValueAtTime(.0001, now);
        gain.gain.exponentialRampToValueAtTime(.24 * SFX_VOLUME, now + .02);
        gain.gain.exponentialRampToValueAtTime(.0001, now + .25);
        osc.connect(gain);
        osc.start(now);
        osc.stop(now + .27);
      }
    }

    function playBgmFromStart() {
      ensureAudioContext();
      gameMusic.currentTime = 0;
      gameMusic.volume = BGM_VOLUME;
      gameMusic.play().catch(() => {
        showToast("音乐未能自动播放，可继续试玩");
      });
    }

    function getProgress() {
      if (!running || !gameStartTime) return 0;
      return clamp((performance.now() - gameStartTime) / (totalGameSeconds * 1000), 0, 1);
    }

    function getGroupSize() {
      const elapsedSeconds = getBeatClock();
      return Math.max(1, Math.floor(elapsedSeconds / 20) + 1);
    }

    function updateLevelByTime() {
      const nextLevel = getGroupSize();
      if (nextLevel === currentLevel) return;
      currentLevel = nextLevel;
      updateHud();
      showToast(`Level ${currentLevel} 难度提升！`, 1620);
    }

    function createMic(now, groupId, index = 0) {
      const el = document.createElement("div");
      el.className = "mic";
      el.innerHTML = '<div class="cap"></div><div class="handle"></div>';
      arena.appendChild(el);

      const rect = arena.getBoundingClientRect();
      const startX = rect.width * (0.77 + Math.random() * 0.1);
      const startY = rect.height * 0.23;
      const targetX = rect.width * (0.18 + Math.random() * 0.68);
      const endY = rect.height * 0.9;
      const progress = getProgress();
      const baseDuration = 1650 - progress * 480;
      const duration = (baseDuration + Math.random() * 260) / tune.speed;
      const arc = rect.height * (0.28 + Math.random() * 0.16);
      const spin = Math.random() > 0.5 ? 1 : -1;

      mics.push({ el, startX, startY, targetX, endY, duration, arc, startTime: now, spin, groupId, index });
    }

    function createMicGroup(now) {
      mics.forEach(item => item.el.remove());
      mics = [];
      const count = getGroupSize();
      const group = {
        id: now,
        total: count,
        spawned: 0,
        caught: 0,
        missed: 0,
        nextSpawnAt: now,
        spawnGap: 500,
        soundPlayed: false
      };
      currentThrowGroup = group;
      showThrowReaction();
      playTone("throw");
    }

    function maybeSpawnGroupMics(now) {
      if (!currentThrowGroup) return;
      while (currentThrowGroup.spawned < currentThrowGroup.total && now >= currentThrowGroup.nextSpawnAt) {
        createMic(now, currentThrowGroup.id, currentThrowGroup.spawned);
        currentThrowGroup.spawned += 1;
        currentThrowGroup.nextSpawnAt += currentThrowGroup.spawnGap;
      }
    }

    function updateMics(now) {
      if (!mics.length) return;
      [...mics].forEach(item => updateOneMic(item, now));
    }

    function updateOneMic(mic, now) {
      const t = clamp((now - mic.startTime) / mic.duration, 0, 1);
      const ease = 1 - Math.pow(1 - t, 2);
      const x = mic.startX + (mic.targetX - mic.startX) * ease;
      const y = mic.startY + (mic.endY - mic.startY) * t - Math.sin(t * Math.PI) * mic.arc;
      const rot = mic.spin * (t * 760);
      mic.el.style.transform = `translate(${x - 26}px, ${y - 26}px) rotate(${rot}deg)`;

      const arenaRect = arena.getBoundingClientRect();
      const handRect = hands.getBoundingClientRect();
      const worldX = arenaRect.left + x;
      const worldY = arenaRect.top + y;
      const handCenterX = handRect.left + handRect.width / 2;
      const palmCenterY = handRect.top + handRect.height * 0.24;
      const xDistance = Math.abs(worldX - handCenterX);
      const yDistance = Math.abs(worldY - palmCenterY);
      const progress = getProgress();
      const rangeTighten = 1 - progress * .08;
      const withinCatchArea = xDistance <= 42 * tune.catchRange * rangeTighten && yDistance <= 31 * tune.catchRange * rangeTighten;
      const nearPalms = worldY >= handRect.top - 10 * tune.catchRange && worldY <= handRect.top + handRect.height * .5;

      if (withinCatchArea && nearPalms) {
        catchMic(mic, worldX, worldY);
        return;
      }

      if (t >= 1) {
        missMic(mic, worldX, worldY);
      }
    }

    function removeMicItem(mic) {
      mic.el.remove();
      mics = mics.filter(item => item !== mic);
    }

    function finishGroupIfDone() {
      if (!currentThrowGroup) return;
      const resolved = currentThrowGroup.caught + currentThrowGroup.missed;
      if (resolved < currentThrowGroup.total) return;

      if (currentThrowGroup.missed === 0) {
        showResultReaction("happy", REACTION_HOLD_MS);
      } else {
        showResultReaction("miss", REACTION_HOLD_MS);
      }
      nextThrowMusicTime = Math.max(nextThrowMusicTime, getBeatClock() + MIN_GROUP_GAP_SECONDS);
      currentThrowGroup = null;
    }

    function catchMic(mic, x, y) {
      score += 1;
      combo += 1;
      bestCombo = Math.max(bestCombo, combo);
      if (combo % LIFE_REWARD_COMBO === 0 && lives < MAX_LIVES) {
        lives = Math.min(MAX_LIVES, lives + 1);
        showToast("+1 生命值！", 1000);
      }
      updateHud();
      hands.classList.remove("catch");
      void hands.offsetWidth;
      hands.classList.add("catch");
      if (combo >= 3) {
        showComboToast(combo);
      } else {
        showToast("+1 接住了！");
        showFloatingText(x, y, "+1");
      }
      confetti(x, y);
      vibrate(18);
      playTone("catch");
      if (currentThrowGroup && mic.groupId === currentThrowGroup.id) currentThrowGroup.caught += 1;
      removeMicItem(mic);
      finishGroupIfDone();
    }

    function missMic(mic, x, y) {
      misses += 1;
      lives = Math.max(0, lives - 1);
      combo = 0;
      updateHud();
      showToast(lives > 0 ? "漏接了，稳住！" : "生命值耗尽！");
      showFloatingText(x, y, "MISS");
      game.classList.remove("miss-shake");
      void game.offsetWidth;
      game.classList.add("miss-shake");
      vibrate([20, 40, 20]);
      playTone("miss");
      clearTimeout(reactionTimerId);
      setAllCharactersState("miss");
      if (currentThrowGroup && mic.groupId === currentThrowGroup.id) currentThrowGroup.missed += 1;
      removeMicItem(mic);
      if (lives <= 0) {
        mics.forEach(item => item.el.remove());
        mics = [];
        currentThrowGroup = null;
        nextThrowMusicTime = Number.POSITIVE_INFINITY;
        setTimeout(() => {
          if (running) endGame(false, "生命值耗尽，Game Over！");
        }, REACTION_HOLD_MS);
        return;
      }
      finishGroupIfDone();
    }

    function showToast(text = "+1 接住了！", duration = 620) {
      toast.textContent = text;
      toast.classList.remove("combo-toast");
      toast.style.setProperty("--toast-duration", `${duration}ms`);
      toast.classList.remove("show");
      void toast.offsetWidth;
      toast.classList.add("show");
    }

    function showComboToast(count) {
      toast.innerHTML = `<span class="combo-count">${count}x</span><span class="combo-word">COMBO</span>`;
      toast.classList.add("combo-toast");
      toast.style.setProperty("--toast-duration", "860ms");
      toast.classList.remove("show");
      void toast.offsetWidth;
      toast.classList.add("show");
    }

    function showFloatingText(x, y, text) {
      const badge = document.createElement("div");
      badge.className = "floating-score";
      badge.textContent = text;
      badge.style.left = `${x}px`;
      badge.style.top = `${y}px`;
      game.appendChild(badge);
      setTimeout(() => badge.remove(), 760);
    }

    function vibrate(pattern) {
      if (navigator.vibrate) navigator.vibrate(pattern);
    }

    function confetti(x, y) {
      const colors = ["#ff6ea8", "#ffd166", "#46c7ff", "#9f7bff", "#ffffff"];
      for (let i = 0; i < 12; i++) {
        const bit = document.createElement("div");
        bit.className = "confetti";
        bit.style.left = `${x}px`;
        bit.style.top = `${y}px`;
        bit.style.background = colors[i % colors.length];
        bit.style.setProperty("--dx", `${(Math.random() - .5) * 130}px`);
        game.appendChild(bit);
        setTimeout(() => bit.remove(), 840);
      }
    }

    function loop(now) {
      if (!running || paused) return;
      if (!lastFrame) lastFrame = now;
      const delta = now - lastFrame;
      lastFrame = now;
      beatPhase += delta;
      const beatScale = 1 + Math.sin((beatPhase / (60000 / tune.bpm)) * Math.PI * 2) * 0.018;
      document.querySelector(".performers").style.scale = beatScale.toFixed(3);

      const beatClock = getBeatClock();
      updateLevelByTime();
      if (!currentThrowGroup && !mics.length && beatClock >= nextThrowMusicTime) {
        createMicGroup(now);
        lastThrow = now;
        scheduleNextThrowByBeat();
      }

      maybeSpawnGroupMics(now);
      updateMics(now);
      rafId = requestAnimationFrame(loop);
    }

    function startGame() {
      const name = nicknameInput.value.trim() || "微信群友";
      localStorage.setItem(STORAGE_NAME, name);
      score = 0;
      combo = 0;
      bestCombo = 0;
      misses = 0;
      lives = INITIAL_LIVES;
      currentLevel = 1;
      totalGameSeconds = getSongDurationSeconds();
      timeLeft = totalGameSeconds;
      running = true;
      paused = false;
      pauseStartedAt = 0;
      lastFrame = 0;
      gameStartTime = performance.now();
      lastThrow = performance.now() + 400;
      nextThrowDelay = 500;
      nextThrowMusicTime = 4;
      mics.forEach(item => item.el.remove());
      mics = [];
      currentThrowGroup = null;
      clearTimeout(reactionTimerId);
      setAllCharactersState("normal");
      playBgmFromStart();
      updateHud();
      updatePauseUi();
      hideOverlay(startOverlay);
      hideOverlay(endOverlay);
      hint.textContent = "拖动双手接麦克风。越靠近手心越容易接住。";
      clearInterval(timerId);
      timerId = setInterval(() => {
        timeLeft -= 1;
        updateHud();
        if (timeLeft <= 0) endGame();
      }, 1000);
      cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(loop);
    }

    function endGame(showRankOnly = false, reason = "") {
      running = false;
      paused = false;
      pauseStartedAt = 0;
      clearInterval(timerId);
      clearTimeout(reactionTimerId);
      cancelAnimationFrame(rafId);
      gameMusic.pause();
      gameMusic.currentTime = 0;
      updatePauseUi();
      setAllCharactersState("normal");
      mics.forEach(item => item.el.remove());
      mics = [];
      currentThrowGroup = null;
      const name = nicknameInput.value.trim() || localStorage.getItem(STORAGE_NAME) || "微信群友";
      if (!showRankOnly) saveRank(name, score);
      renderRanks();
      endTitle.textContent = showRankOnly ? "本地排行榜" : (reason ? "Game Over" : "游戏结束");
      endText.textContent = showRankOnly ? "这个榜单目前保存在本机浏览器里。接真实后端后，微信群友就能共享同一个榜。" : `${reason ? reason + " " : ""}你的分数是 ${score}，最高连击 ${bestCombo}，漏接 ${misses} 次。${score >= 10 ? "舞台救援很稳！" : "再来一次，接麦手感会更准。"}`;
      hideOverlay(startOverlay);
      showOverlay(endOverlay);
    }

    function resetRank() {
      localStorage.removeItem(STORAGE_RANK);
      renderRanks();
      endGame(true);
    }

    function togglePause() {
      if (!running) return;
      if (!paused) {
        paused = true;
        pauseStartedAt = performance.now();
        clearInterval(timerId);
        gameMusic.pause();
        cancelAnimationFrame(rafId);
        updatePauseUi();
        return;
      }

      const now = performance.now();
      const pausedDuration = now - pauseStartedAt;
      paused = false;
      pauseStartedAt = 0;
      gameStartTime += pausedDuration;
      lastThrow += pausedDuration;
      mics.forEach(item => item.startTime += pausedDuration);
      if (currentThrowGroup) currentThrowGroup.nextSpawnAt += pausedDuration;
      lastFrame = now;
      updatePauseUi();
      gameMusic.play().catch(() => {});
      clearInterval(timerId);
      timerId = setInterval(() => {
        if (paused || !running) return;
        timeLeft -= 1;
        updateHud();
        if (timeLeft <= 0) endGame();
      }, 1000);
      rafId = requestAnimationFrame(loop);
    }

    game.addEventListener("pointerdown", event => {
      if (!running || paused || event.target.closest(".overlay") || event.target.closest("button")) return;
      setHandsByClientX(event.clientX);
      game.setPointerCapture?.(event.pointerId);
    });
    game.addEventListener("pointermove", event => {
      if (!running || paused || event.target.closest(".overlay")) return;
      if (event.pointerType === "mouse" && event.buttons === 0) return;
      setHandsByClientX(event.clientX);
    });

    document.getElementById("startBtn").addEventListener("click", startGame);
    document.getElementById("againBtn").addEventListener("click", startGame);
    document.getElementById("rankBtn").addEventListener("click", () => endGame(true));
    document.getElementById("resetBtn").addEventListener("click", resetRank);
    langToggle.addEventListener("click", () => {
      uiLang = uiLang === "zh" ? "en" : "zh";
      localStorage.setItem(STORAGE_LANG, uiLang);
      applyLanguage();
    });
    gameMusic.addEventListener("loadedmetadata", () => {
      if (!running) {
        totalGameSeconds = getSongDurationSeconds();
        timeLeft = totalGameSeconds;
        updateHud();
      }
    });
    gameMusic.addEventListener("ended", () => {
      if (running) endGame();
    });
    pauseBtn.addEventListener("pointerdown", event => event.stopPropagation());
    pauseBtn.addEventListener("click", event => {
      event.stopPropagation();
      togglePause();
    });
    resumeBtn.addEventListener("pointerdown", event => event.stopPropagation());
    resumeBtn.addEventListener("click", event => {
      event.stopPropagation();
      togglePause();
    });

    function bindTune(id, key, labelId) {
      const input = document.getElementById(id);
      const label = document.getElementById(labelId);
      if (!input || !label) return;
      const sync = () => {
        tune[key] = Number(input.value) / 100;
        label.textContent = `${input.value}%`;
      };
      input.addEventListener("input", sync);
      sync();
    }

    bindTune("speedTune", "speed", "speedTuneValue");
    bindTune("freqTune", "frequency", "freqTuneValue");
    bindTune("catchTune", "catchRange", "catchTuneValue");

    function bindBpmTune() {
      const input = document.getElementById("bpmTune");
      const label = document.getElementById("bpmTuneValue");
      if (!input || !label) return;
      const sync = () => {
        tune.bpm = Number(input.value);
        label.textContent = input.value;
      };
      input.addEventListener("input", sync);
      sync();
    }

    bindBpmTune();

    window.addEventListener("resize", () => {
      hands.style.left = `${handX * 100}%`;
    });

    updateHud();
    renderRanks();
    hands.style.left = "50%";
    applyLanguage();
    preloadGameAssets();
  </script>
</body>
</html>
